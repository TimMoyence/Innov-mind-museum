services:
  backend:
    build:
      context: ..
      dockerfile: museum-backend/Dockerfile.dev
    container_name: dev-backend
    working_dir: /app/museum-backend
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app/museum-backend
      - /app/museum-backend/node_modules
      - /app/packages/musaium-shared/node_modules
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    container_name: dev-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - '5433:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${PGDATABASE:-museumAI}']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    container_name: dev-redis
    command:
      - 'redis-server'
      - '--requirepass'
      - '${REDIS_PASSWORD:-dev-redis-password}'
      - '--maxmemory-policy'
      - '${REDIS_MAXMEMORY_POLICY:-volatile-ttl}'
    ports:
      - '6379:6379'
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD:-dev-redis-password}" PING | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  adminer:
    image: adminer:latest@sha256:983261ecc40a4aaf11e25aeda8ef821f5a43a9f024b3967c81cbcc0e6ce43ba3
    container_name: dev-adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8082:8080'
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0@sha256:b44c283298cea49e2defaba1b3028783798346f2a926684e3a345fd8441af3b8
    container_name: dev-toxiproxy
    profiles: [weaknet]
    depends_on:
      - backend
    ports:
      - '8474:8474'
      - '3100:3100'
    entrypoint:
      - /bin/sh
      - -c
      - >
        /toxiproxy -host=0.0.0.0 &
        until /toxiproxy-cli list >/dev/null 2>&1; do sleep 0.2; done;
        /toxiproxy-cli create -l 0.0.0.0:3100 -u backend:3000 backend || true;
        wait
    restart: unless-stopped

volumes:
  pgdata_dev:
