networks:
  web:
    external: true
  private:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redis_data:
  uploads:

services:
  backend:
    image: ghcr.io/timmoyence/museum-backend:${IMAGE_TAG:?IMAGE_TAG required — set in /srv/museum/.env or export before docker compose. CI persists it on every deploy; for manual ops grab the latest from GHCR.}
    hostname: backend
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/tmp/uploads
    networks:
      private: {}
      web:
        aliases:
          - museum-backend
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

  museum-web:
    image: ghcr.io/timmoyence/museum-web:${WEB_IMAGE_TAG:-latest}
    hostname: museum-web
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    networks:
      private: {}
      web:
        aliases:
          - museum-web
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  db:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_INITDB_ARGS: '--auth=scram-sha-256'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    command:
      - 'redis-server'
      - '--requirepass'
      - '${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env for production}'
      - '--appendonly'
      - 'yes'
      - '--maxmemory'
      - '${REDIS_MAXMEMORY:-512mb}'
      - '--maxmemory-policy'
      - '${REDIS_MAXMEMORY_POLICY:-volatile-ttl}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" PING | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
