name: scan-prod-image
description: Build a production image into the local Docker daemon and fail on any fixed HIGH or CRITICAL vulnerability.

inputs:
  dockerfile:
    description: Dockerfile path, relative to the repository root build context.
    required: true
  tag:
    description: Local tag given to the built image.
    required: true
  build-args:
    description: Newline-separated build arguments.
    required: false
    default: ''
  cache-from:
    description: Buildx cache source.
    required: false
    default: ''
  cache-to:
    description: Buildx cache destination.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        load: true
        tags: ${{ inputs.tag }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}

    - name: Trivy image scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        image-ref: ${{ inputs.tag }}
        format: table
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true
        trivyignores: .trivyignore
