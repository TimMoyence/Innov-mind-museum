name: deploy-privacy-policy

on:
  push:
    branches: ['main']
    paths:
      - 'docs/privacy-policy.html'
      - 'docs/maplibre/**'
      - '.github/workflows/deploy-privacy-policy.yml'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy-policy.html
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Prepare pages artifact
        run: |
          mkdir -p _site/maplibre
          cp docs/privacy-policy.html _site/privacy-policy.html
          cp docs/maplibre/cartodb-raster-style.json _site/maplibre/cartodb-raster-style.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1