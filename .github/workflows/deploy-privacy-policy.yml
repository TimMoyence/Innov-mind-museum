name: deploy-privacy-policy

on:
  push:
    branches: ['main']
    paths:
      - 'packages/musaium-shared/src/map/**'
      - '.github/workflows/deploy-privacy-policy.yml'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}maplibre/cartodb-raster-style.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
      - name: Build the offline map style from the shared source
        run: |
          mkdir -p _site/maplibre
          node --experimental-strip-types --no-warnings -e "import('./packages/musaium-shared/src/map/index.ts').then((m) => process.stdout.write(JSON.stringify(m.buildRasterMapStyle(false))))" > _site/maplibre/cartodb-raster-style.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
