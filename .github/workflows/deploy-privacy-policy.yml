name: deploy-privacy-policy

on:
  push:
    branches: ['main']
    paths:
      - 'packages/musaium-shared/src/map/**'
      - '.github/workflows/deploy-privacy-policy.yml'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}maplibre/cartodb-raster-style.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
      - name: Build the offline map style from the shared source
        run: |
          mkdir -p _site/maplibre
          node --experimental-strip-types --no-warnings -e "import('./packages/musaium-shared/src/map/index.ts').then((m) => process.stdout.write(JSON.stringify(m.buildRasterMapStyle(false))))" > _site/maplibre/cartodb-raster-style.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
