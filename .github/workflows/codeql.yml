name: codeql


on:
  pull_request: {}
  push:
    branches: ['main']
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        id: filter
        with:
          filters: |
            code:
              - 'museum-backend/src/**'
              - 'museum-frontend/features/**'
              - 'museum-frontend/shared/**'
              - 'museum-frontend/app/**'
              - 'museum-web/src/**'
              - '.github/workflows/codeql.yml'

  analyze:
    name: CodeQL (javascript-typescript)
    needs: changes
    if: |
      needs.changes.outputs.code == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
          config: |
            paths:
              - museum-backend/src
              - museum-frontend/features
              - museum-frontend/shared
              - museum-frontend/app
              - museum-web/src
            paths-ignore:
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/tests/**'
              - '**/__tests__/**'
              - '**/__mocks__/**'
              - '**/dist/**'
              - '**/.next/**'
              - '**/coverage/**'
              - '**/.stryker-tmp/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: '/language:javascript-typescript'
          upload: always
