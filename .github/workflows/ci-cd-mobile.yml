name: mobile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile to run
        required: true
        default: internal
        type: choice
        options:
          - preview
          - internal
          - production
      platform:
        description: Platform target
        required: true
        default: android
        type: choice
        options:
          - ios
          - android
          - all
      submit:
        description: Submit to stores (production only)
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
  pull_request:
    paths:
      - 'museum-frontend/**'
      - 'museum-backend/openapi/**'
      - '.github/workflows/ci-cd-mobile.yml'
  push:
    branches: ['main']
    tags: ['v*']
    paths:
      - 'museum-frontend/**'
      - 'museum-backend/openapi/**'
      - '.github/workflows/ci-cd-mobile.yml'
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ci-cd-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FREE_TIER_MONTHLY_SESSION_LIMIT: '1000'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: museum-frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo Doctor
        run: |
          set +e
          OUTPUT=$(npx expo-doctor 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          NON_METRO=$(printf '%s\n' "$OUTPUT" | grep '✖' | grep -v 'Check for issues with Metro config' || true)
          if [ -n "$NON_METRO" ]; then
            echo "::error::expo-doctor reported a failed check other than the tolerated Metro-symlinks one:"
            printf '%s\n' "$NON_METRO"
            exit 1
          fi
          echo "expo-doctor: only the known intentional Metro-symlinks check failed — tolerated."

      - name: Check OpenAPI Typegen Sync
        run: npm run check:openapi-types

      - name: Validate Backend OpenAPI Spec
        working-directory: museum-backend
        run: |
          corepack enable && pnpm install --frozen-lockfile
          pnpm run openapi:validate

      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: museum-frontend
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: museum-frontend/node_modules,museum-frontend/ios/Pods
          trivyignores: museum-frontend/.trivyignore

      - name: Generate mobile SBOM (CycloneDX)
        continue-on-error: true
        run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-mobile.json --spec-version 1.5 --output-reproducible

      - name: Upload mobile SBOM artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-mobile
          path: museum-frontend/sbom-mobile.json
          retention-days: 90

      - name: Check i18n completeness
        run: npm run check:i18n

      - name: Check no unicode emoji in screens/copy (P4 emoji guard)
        run: node ../scripts/check-no-unicode-emoji.cjs

      - name: Screen test-coverage sentinel (UFR-021)
        run: node ../scripts/sentinels/screen-test-coverage.mjs

      - name: Maestro shard-manifest sentinel
        run: node ../scripts/sentinels/maestro-shard-manifest.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage gate
        run: npm run test:coverage

  prebuild:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: museum-frontend
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:3000
      EXPO_PUBLIC_MAESTRO_AUDIO_FIXTURE: 'true'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    outputs:
      cache-hit: ${{ steps.cache-apk.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json

      - name: Restore APK cache
        id: cache-apk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: museum-frontend/android/app/build/outputs/apk/release/app-release.apk
          key: maestro-apk-release-v2-${{ runner.os }}-${{ hashFiles('museum-frontend/src/**', 'museum-frontend/features/**', 'museum-frontend/shared/**', 'museum-frontend/app/**', 'museum-frontend/assets/**', 'museum-frontend/app.config.ts', 'museum-frontend/api-url.config.js', 'museum-frontend/babel.config.js', 'museum-frontend/metro.config.js', 'museum-frontend/index.js', 'museum-frontend/plugins/**', 'museum-frontend/package.json', 'museum-frontend/package-lock.json') }}
          restore-keys: |
            maestro-apk-release-v2-${{ runner.os }}-

      - name: Setup Java (cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm deps (cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Expo prebuild Android (cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle (cache deps, cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          cache-read-only: false

      - name: Gradle assembleRelease (cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace --init-script ../scripts/ci/maven-central-mirror.init.gradle -PreactNativeArchitectures=x86_64

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: maestro-apk
          path: museum-frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  maestro-matrix:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.set.outputs.shards }}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo 'shards=["smoke"]' >> "$GITHUB_OUTPUT"
          else
            echo 'shards=["auth","chat","museum","settings"]' >> "$GITHUB_OUTPUT"
          fi

  maestro-shard:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [prebuild, maestro-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.maestro-matrix.outputs.shards) }}
    defaults:
      run:
        working-directory: museum-frontend
    env:
      MAESTRO_VERSION: '2.5.1'
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: museum_dev
          POSTGRES_PASSWORD: museum_dev_password
          POSTGRES_DB: museum_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U museum_dev -d museum_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: maestro-apk
          path: museum-frontend/android/app/build/outputs/apk/release/

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Verify Maestro version
        run: maestro --version

      - name: Login to GHCR (chat shard — SigLIP base image)
        if: matrix.shard == 'chat'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Boot backend (PG/Redis services + migrations + API + e2e seed)
        working-directory: museum-frontend
        env:
          SKIP_DOCKER_COMPOSE: '1'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: museum_dev
          DB_PASSWORD: museum_dev_password
          PGDATABASE: museum_dev
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          EXTRACTION_WORKER_ENABLED: 'false'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAT_COMPARE_PROVISION: ${{ matrix.shard == 'chat' && '1' || '' }}
        run: ./scripts/maestro-runner-setup.sh

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro shard on Android emulator (attempt 1)
        id: maestro_attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-boot-timeout: 300
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash museum-frontend/scripts/maestro-emulator-script.sh "$MATRIX_SHARD"

      - name: Run Maestro shard on Android emulator (attempt 2, retry on attempt-1 failure)
        if: steps.maestro_attempt1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 300
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash museum-frontend/scripts/maestro-emulator-script.sh "$MATRIX_SHARD"

      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: maestro-shard-${{ matrix.shard }}-logs
          path: museum-frontend/.maestro/logs/
          retention-days: 7

      - name: Collect failure diagnostics (backend log + Maestro hierarchy)
        if: always()
        run: |
          mkdir -p /tmp/diag
          cp /tmp/backend.log /tmp/diag/backend.log 2>/dev/null || true
          cp -r "$HOME/.maestro/tests" /tmp/diag/maestro-tests 2>/dev/null || true
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: maestro-shard-${{ matrix.shard }}-diag
          path: /tmp/diag/
          retention-days: 7

  maestro-summary:
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs: maestro-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: shard-logs
      - name: Summarize shard logs + fail on any FAIL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'shard-logs';
            const shards = fs.existsSync(root) ? fs.readdirSync(root) : [];
            const lines = ['## Maestro shard results', ''];
            let totalFails = 0;
            for (const shard of shards) {
              const dir = path.join(root, shard);
              const logs = fs.readdirSync(dir).filter(f => f.endsWith('.log'));
              const fails = logs.filter(f => fs.readFileSync(path.join(dir, f), 'utf-8').includes('FAIL'));
              totalFails += fails.length;
              lines.push(`- **${shard}**: ${logs.length - fails.length}/${logs.length} flows passed${fails.length ? ` — failed: ${fails.map(f => f.replace('.log','')).join(', ')}` : ''}`);
            }
            const body = lines.join('\n');
            core.summary.addRaw(body).write();
            // Post a PR comment only when this run is attached to a PR (cron/dispatch have none).
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.pull_request?.number;
            if (issueNumber) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }
            // Anti-false-green (audit 360 dim.2): a flow that logged FAIL must turn
            // this job red, even on cron/dispatch where there is no PR to comment on.
            if (totalFails > 0) {
              core.setFailed(`${totalFails} Maestro flow(s) failed across ${shards.length} shard(s) — see logs.`);
            }

      - name: Fail if any shard did not succeed
        if: ${{ needs.maestro-shard.result != 'success' }}
        run: |
          echo "::error::Maestro e2e did not pass (maestro-shard result: ${{ needs.maestro-shard.result }}). A green maestro-summary now REQUIRES every shard to succeed."
          exit 1

  maestro-full-alert:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs: [maestro-shard, maestro-summary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open/close the full-Maestro tracking issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const failed = ${{ needs.maestro-shard.result != 'success' || needs.maestro-summary.result != 'success' }};
            const { owner, repo } = context.repo;
            const label = 'nightly-maestro-alert';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const trigger = context.eventName === 'schedule' ? 'nightly' : 'push to main';
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            if (failed) {
              const body = `The full Maestro suite failed on a **${trigger}** run.\n\nRun: ${runUrl}\n\nThis issue auto-closes when the next full Maestro run is green.`;
              if (existing.data.length > 0) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.data[0].number, body: `Still failing (${trigger}) — ${runUrl}` });
              } else {
                try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
                catch { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'Auto-filed when a full Maestro run fails' }); }
                await github.rest.issues.create({ owner, repo, title: `🌙 Full Maestro failing (${trigger})`, body, labels: [label] });
              }
            } else {
              for (const issue of existing.data) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `✅ Full Maestro green again — ${runUrl}. Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            }

  prebuild-netshape:
    needs: quality
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: museum-frontend
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:3100
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json

      - name: Restore weak-net APK cache
        id: cache-apk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: museum-frontend/android/app/build/outputs/apk/release/app-release.apk
          key: maestro-apk-netshape-v1-${{ runner.os }}-${{ hashFiles('museum-frontend/src/**', 'museum-frontend/features/**', 'museum-frontend/shared/**', 'museum-frontend/app/**', 'museum-frontend/assets/**', 'museum-frontend/app.config.ts', 'museum-frontend/api-url.config.js', 'museum-frontend/babel.config.js', 'museum-frontend/metro.config.js', 'museum-frontend/index.js', 'museum-frontend/plugins/**', 'museum-frontend/package.json', 'museum-frontend/package-lock.json') }}
          restore-keys: |
            maestro-apk-netshape-v1-${{ runner.os }}-

      - name: Setup Java (cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm deps (cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Expo prebuild Android (cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle (cache deps, cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          cache-read-only: false

      - name: Gradle assembleRelease (cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace --init-script ../scripts/ci/maven-central-mirror.init.gradle -PreactNativeArchitectures=x86_64

      - name: Upload weak-net APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: maestro-apk-netshape
          path: museum-frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  netshape-matrix:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.set.outputs.run }}
      shard: ${{ steps.set.outputs.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - id: changed
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        with:
          filters: |
            netshape:
              - 'museum-frontend/features/chat/**'
              - 'museum-frontend/shared/infrastructure/connectivity/**'
              - 'museum-frontend/.maestro/net-*.yaml'
              - 'museum-frontend/.maestro/helpers/**'
              - 'museum-frontend/.maestro/shards.json'
              - 'museum-backend/src/shared/net-shaping/**'
              - 'scripts/net-shaping/**'
              - '.github/workflows/ci-cd-mobile.yml'
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          PR_HIT: ${{ steps.changed.outputs.netshape }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            if [ "$PR_HIT" = "true" ]; then
              echo 'run=true'  >> "$GITHUB_OUTPUT"
              echo 'shard=netshapeSmoke' >> "$GITHUB_OUTPUT"
            else
              echo 'run=false' >> "$GITHUB_OUTPUT"
              echo 'shard=netshapeSmoke' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'shard=netshape' >> "$GITHUB_OUTPUT"
          fi

  maestro-netshape-nightly:
    needs: [prebuild-netshape, netshape-matrix]
    if: ${{ needs.netshape-matrix.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: museum-frontend
    env:
      MAESTRO_VERSION: '2.5.1'
      NETSHAPE_SHARD: ${{ needs.netshape-matrix.outputs.shard }}
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: museum_dev
          POSTGRES_PASSWORD: museum_dev_password
          POSTGRES_DB: museum_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U museum_dev -d museum_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.9.0
        ports:
          - 8474:8474
          - 3100:3100
        options: --add-host=host.docker.internal:host-gateway
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Download weak-net APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: maestro-apk-netshape
          path: museum-frontend/android/app/build/outputs/apk/release/
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Verify Maestro version
        run: maestro --version

      - name: Boot backend (PG/Redis services + migrations + API + e2e seed)
        working-directory: museum-frontend
        env:
          SKIP_DOCKER_COMPOSE: '1'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: museum_dev
          DB_PASSWORD: museum_dev_password
          PGDATABASE: museum_dev
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          EXTRACTION_WORKER_ENABLED: 'false'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./scripts/maestro-runner-setup.sh

      - name: Seed Toxiproxy shaped link (edge profile, both streams)
        working-directory: museum-frontend
        run: |
          set -euo pipefail
          curl -fsS -X POST http://localhost:8474/proxies \
            -d '{"name":"backend","listen":"0.0.0.0:3100","upstream":"host.docker.internal:3000","enabled":true}'
          TOXICS=$(node ../scripts/net-shaping/profile-to-toxics.mjs edge)
          echo "edge toxics (from toToxics, both streams): $TOXICS"
          echo "$TOXICS" | jq -c '.[]' | while read -r toxic; do
            curl -fsS -X POST http://localhost:8474/proxies/backend/toxics \
              -d "$toxic"
          done
          SEEDED=$(curl -fsS http://localhost:8474/proxies/backend/toxics)
          echo "installed toxics: $SEEDED"
          echo "$SEEDED" | jq -e 'map(.stream) | (index("upstream") != null) and (index("downstream") != null)' \
            || { echo "::error::Toxiproxy is missing an upstream and/or downstream toxic — shaped link not in place"; exit 1; }
          curl -fsS --max-time 30 http://localhost:3100/api/health > /dev/null \
            || { echo "::error::Toxiproxy cannot reach the backend through the shaped link (upstream host.docker.internal:3000)"; exit 1; }

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run weak-net Maestro shard (shaped link, wall-clock timed)
        id: netshape_run
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          NETSHAPE_SHARD: ${{ needs.netshape-matrix.outputs.shard }}
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-boot-timeout: 300
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            START=$(date +%s)
            bash museum-frontend/scripts/maestro-emulator-script.sh "$NETSHAPE_SHARD"
            STATUS=$?
            END=$(date +%s)
            echo "netshape_wall_clock_seconds=$((END - START))" >> "$GITHUB_OUTPUT"
            echo "::notice::weak-net shard '$NETSHAPE_SHARD' wall-clock: $((END - START))s (compression metric)"
            exit $STATUS

      - name: Upload weak-net shard logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: maestro-netshape-logs
          path: museum-frontend/.maestro/logs/
          include-hidden-files: true
          retention-days: 7

      - name: Weak-net summary (wall-clock compression note)
        if: always()
        run: |
          WC="${{ steps.netshape_run.outputs.netshape_wall_clock_seconds }}"
          {
            echo "## Weak-net (Toxiproxy) Maestro — shard \`$NETSHAPE_SHARD\`"
            echo ""
            echo "- shaped-link wall-clock: **${WC:-n/a}s** (compression metric, device→Toxiproxy edge profile)"
            echo "- shaped link: APK baked at 10.0.2.2:3100 → Toxiproxy → backend :3000 (genuine, both streams; seed fails hard)"
          } >> "$GITHUB_STEP_SUMMARY"

  maestro-ios-nightly:
    if: ${{ github.event_name == 'schedule' }}
    needs: quality
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: museum-frontend
    env:
      MAESTRO_VERSION: '2.5.1'
      EXPO_PUBLIC_MAESTRO_AUDIO_FIXTURE: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
      - name: Install npm deps
        run: npm install --no-audit --no-fund
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)"
          sh ios/ci_scripts/require-xcode.sh
      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --clean
      - name: Build iOS Debug app for Simulator
        run: |
          cd ios
          xcodebuild -workspace Musaium.xcworkspace \
            -scheme Musaium \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot backend (docker-compose + migrations + API)
        run: ./scripts/maestro-runner-setup.sh
      - name: Seed e2e Maestro login accounts (iOS nightly runs the `all` union)
        run: DB_PORT=5433 ./scripts/maestro-seed-accounts.sh
      - name: Boot iOS Simulator
        run: |
          xcrun simctl create maestro-sim "iPhone 15" "iOS17.5" || true
          xcrun simctl boot "maestro-sim" || true
      - name: Install app on simulator
        run: |
          APP_PATH=$(find ios/build/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          xcrun simctl install booted "$APP_PATH"
      - name: Seed Maestro fixtures into simulator photo library
        run: |
          if [ -f .maestro/fixtures/test-artwork.jpg ]; then
            xcrun simctl addmedia booted .maestro/fixtures/test-artwork.jpg
          fi
      - name: Run all Maestro flows (sequential)
        run: ./scripts/maestro-run-shard.sh all
      - name: Upload iOS Maestro logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: maestro-ios-nightly-logs
          path: museum-frontend/.maestro/logs/
          retention-days: 7

  build-preview-ios:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'preview' && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all') }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: museum-frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo auth
        run: test -n "$EXPO_TOKEN"

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.5.0

      - name: Verify EAS CLI
        run: eas --version

      - name: Build iOS preview
        run: eas build --platform ios --profile preview --non-interactive --no-wait

  build-preview-android:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'preview' && (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all') }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: museum-frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo auth
        run: test -n "$EXPO_TOKEN"

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.5.0

      - name: Verify EAS CLI
        run: eas --version

      - name: Build Android preview
        run: eas build --platform android --profile preview --non-interactive --no-wait

  build-internal-android:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'internal' && (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all') }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: museum-frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate internal Android build env
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"

      - name: Prepare Google Play service account key
        run: |
          mkdir -p .secrets
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > .secrets/google-service-account.json

      - name: Validate Expo auth
        run: test -n "$EXPO_TOKEN"

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.5.0

      - name: Verify EAS CLI
        run: eas --version

      - name: Build and auto-submit Android internal testing release
        run: eas build --platform android --profile internal --auto-submit-with-profile internal --non-interactive --no-wait

  build-production-android:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'production' && (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all')) || (startsWith(github.ref, 'refs/tags/v') && vars.AUTO_TAG_BUILD_ANDROID == 'true') }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: museum-frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SUBMIT: ${{ github.event.inputs.submit == 'yes' || (startsWith(github.ref, 'refs/tags/v') && vars.AUTO_TAG_BUILD_ANDROID == 'true') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: museum-frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo auth
        run: test -n "$EXPO_TOKEN"

      - name: Prepare Google Play service account key
        if: env.SUBMIT == 'true'
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          mkdir -p .secrets
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > .secrets/google-service-account.json

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.5.0

      - name: Verify EAS CLI
        run: eas --version

      - name: Build Android production
        run: eas build --platform android --profile production --non-interactive --no-wait ${{ env.SUBMIT == 'true' && '--auto-submit-with-profile production' || '' }}

