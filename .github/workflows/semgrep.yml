name: semgrep

# Path filtering moved from workflow-level `on.pull_request.paths` to a
# job-level `if:` gated by `dorny/paths-filter`. See codeql.yml header for
# rationale (Renovate workflow-SHA bumps left required checks Pending forever).

on:
  pull_request: {}
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        id: filter
        with:
          filters: |
            code:
              - 'museum-backend/src/**'
              - 'museum-frontend/features/**'
              - 'museum-frontend/shared/**'
              - 'museum-web/src/**'
              - '.github/workflows/semgrep.yml'

  semgrep:
    needs: changes
    if: |
      needs.changes.outputs.code == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Semgrep scan
        run: semgrep scan --config auto --config p/javascript --config p/typescript --config p/nodejs --config p/owasp-top-ten --error --json --output semgrep-results.json museum-backend/src/ museum-frontend/features/ museum-frontend/shared/ museum-web/src/

      - name: Generate SARIF
        if: always()
        run: semgrep scan --config auto --config p/javascript --config p/typescript --config p/nodejs --config p/owasp-top-ten --sarif --output semgrep-results.sarif museum-backend/src/ museum-frontend/features/ museum-frontend/shared/ museum-web/src/ || true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: semgrep-results
          path: |
            semgrep-results.json
            semgrep-results.sarif
