name: web

on:
  pull_request:
    paths:
      - 'museum-web/**'
      - 'packages/musaium-shared/**'
      - '.trivyignore'
      - '.github/actions/scan-prod-image/**'
      - '.github/workflows/ci-cd-web.yml'
  push:
    paths:
      - 'museum-web/**'
      - 'packages/musaium-shared/**'
      - '.trivyignore'
      - '.github/actions/scan-prod-image/**'
      - '.github/workflows/ci-cd-web.yml'
    branches: ['main']
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-cd-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: museum-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: museum-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: museum-web
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Verify OpenAPI types up to date
        run: pnpm run check:openapi-types

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Web cookies audit sentinel (R18)
        run: node ../museum-backend/scripts/sentinels/web-cookies-audit.mjs
      - name: Web canonical-domain sentinel (no musaium.app)
        run: node ../museum-backend/scripts/sentinels/web-domain-canonical.mjs

  playwright-pr:
    needs: quality
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: museum-web
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: museum_dev
          POSTGRES_PASSWORD: museum_dev_password
          POSTGRES_DB: museum_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            museum-web/pnpm-lock.yaml
            museum-backend/pnpm-lock.yaml

      - name: Install backend deps
        working-directory: museum-backend
        run: pnpm install --frozen-lockfile
      - name: Run backend migrations
        working-directory: museum-backend
        env:
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_USER: museum_dev
          DB_PASSWORD: museum_dev_password
          PGDATABASE: museum_dev
        run: pnpm migration:run
      - name: Start backend
        working-directory: museum-backend
        env:
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_USER: museum_dev
          DB_PASSWORD: museum_dev_password
          PGDATABASE: museum_dev
          PORT: '3000'
          JWT_ACCESS_SECRET: phase3-access
          JWT_REFRESH_SECRET: phase3-refresh
          CORS_ORIGINS: http://localhost:3001
        run: nohup pnpm dev > /tmp/be.log 2>&1 &
      - name: Wait for backend health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "Backend did not become healthy"; tail -50 /tmp/be.log; exit 1

      - name: Install web deps
        run: pnpm install --frozen-lockfile
      - name: Build Next.js (production)
        env:
          API_BASE_URL: http://localhost:3000
        run: pnpm build
      - name: Start Next.js production server
        env:
          API_BASE_URL: http://localhost:3000
        run: nohup pnpm start > /tmp/web.log 2>&1 &
      - name: Wait for web ready
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3001/en > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "Web did not come up"; tail -50 /tmp/web.log; exit 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright suite (Chromium)
        env:
          PW_BROWSERS: chromium
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_USER: museum_dev
          DB_PASSWORD: museum_dev_password
          PGDATABASE: museum_dev
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report-pr
          path: museum-web/playwright-report/
          retention-days: 7

  playwright-nightly:
    needs: quality
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: museum-web
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: museum_dev
          POSTGRES_PASSWORD: museum_dev_password
          POSTGRES_DB: museum_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            museum-web/pnpm-lock.yaml
            museum-backend/pnpm-lock.yaml
      - name: Install backend deps
        working-directory: museum-backend
        run: pnpm install --frozen-lockfile
      - name: Run backend migrations
        working-directory: museum-backend
        env:
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_USER: museum_dev
          DB_PASSWORD: museum_dev_password
          PGDATABASE: museum_dev
        run: pnpm migration:run
      - name: Start backend
        working-directory: museum-backend
        env:
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_USER: museum_dev
          DB_PASSWORD: museum_dev_password
          PGDATABASE: museum_dev
          PORT: '3000'
          JWT_ACCESS_SECRET: phase3-access
          JWT_REFRESH_SECRET: phase3-refresh
          CORS_ORIGINS: http://localhost:3001
        run: nohup pnpm dev > /tmp/be.log 2>&1 &
      - name: Wait for backend
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          tail -50 /tmp/be.log; exit 1
      - name: Install web deps
        run: pnpm install --frozen-lockfile
      - name: Build Next.js (production)
        env:
          API_BASE_URL: http://localhost:3000
        run: pnpm build
      - name: Start Next.js production server
        env:
          API_BASE_URL: http://localhost:3000
        run: nohup pnpm start > /tmp/web.log 2>&1 &
      - name: Wait for web
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3001/en > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          tail -50 /tmp/web.log; exit 1
      - name: Install Playwright browsers (all)
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run Playwright suite (all browsers)
        env:
          PW_BROWSERS: chromium,firefox,webkit
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_USER: museum_dev
          DB_PASSWORD: museum_dev_password
          PGDATABASE: museum_dev
        run: pnpm test:e2e
      - name: Upload Playwright nightly report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report-nightly
          path: museum-web/playwright-report/
          retention-days: 14

  playwright-nightly-alert:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [playwright-nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open/close the nightly web-e2e tracking issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const failed = ${{ needs.playwright-nightly.result != 'success' }};
            const { owner, repo } = context.repo;
            const label = 'nightly-web-e2e-alert';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            if (failed) {
              const body = `The nightly multi-browser Playwright (web e2e) suite failed.\n\nRun: ${runUrl}\n\nThis issue auto-closes when the next nightly web-e2e run is green.`;
              if (existing.data.length > 0) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.data[0].number, body: `Still failing (nightly) — ${runUrl}` });
              } else {
                try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
                catch { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'Auto-filed when a nightly web Playwright run fails' }); }
                await github.rest.issues.create({ owner, repo, title: `🌙 Nightly web Playwright failing`, body, labels: [label] });
              }
            } else {
              for (const issue of existing.data) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `✅ Nightly web Playwright green again — ${runUrl}. Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            }

  lighthouse:
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: museum-web/pnpm-lock.yaml

      - name: Install & Build
        working-directory: museum-web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # 12.6.2
        with:
          configPath: museum-web/lighthouserc.json
          uploadArtifacts: true

  image:
    needs: quality
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build and scan image
        uses: ./.github/actions/scan-prod-image
        with:
          dockerfile: ./museum-web/deploy/Dockerfile.prod
          tag: museum-web:ci
          build-args: |
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.PLAUSIBLE_DOMAIN || 'musaium.com' }}

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: museum-web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: museum-web
        run: pnpm install --frozen-lockfile
      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: PGP placeholder deploy gate
        run: node scripts/sentinels/wellknown-placeholder-free.mjs

      - name: Build and scan image
        uses: ./.github/actions/scan-prod-image
        with:
          dockerfile: ./museum-web/deploy/Dockerfile.prod
          tag: museum-web:ci
          build-args: |
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.PLAUSIBLE_DOMAIN || 'musaium.com' }}

      - name: Push image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./museum-web/deploy/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.PLAUSIBLE_DOMAIN || 'musaium.com' }}
          tags: |
            ghcr.io/${{ secrets.GHCR_USER }}/museum-web:latest
            ghcr.io/${{ secrets.GHCR_USER }}/museum-web:${{ github.sha }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          WEB_IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,WEB_IMAGE_TAG
          script: |
            set -e
            cd /srv/museum

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || true

            export WEB_IMAGE_TAG
            echo "[deploy] using WEB_IMAGE_TAG=${WEB_IMAGE_TAG}"

            ENV_FILE=/srv/museum/.env
            BACKUP_DIR="${HOME}/.museum-env-backups"
            mkdir -p "${BACKUP_DIR}"
            sudo cp -p "${ENV_FILE}" "${BACKUP_DIR}/.env.bak.$(date -u +%Y%m%dT%H%M%SZ)"
            sudo grep -v '^WEB_IMAGE_TAG=' "${ENV_FILE}" | sudo tee "${ENV_FILE}.tmp" >/dev/null || true
            echo "WEB_IMAGE_TAG=${WEB_IMAGE_TAG}" | sudo tee -a "${ENV_FILE}.tmp" >/dev/null
            sudo mv "${ENV_FILE}.tmp" "${ENV_FILE}"
            echo "[deploy] persisted WEB_IMAGE_TAG=${WEB_IMAGE_TAG} to ${ENV_FILE}"

            docker compose pull museum-web

            docker compose up -d --no-deps --remove-orphans --timeout 30 museum-web

            echo "Waiting for museum-web healthcheck..."
            TRIES=0
            MAX_TRIES=20
            until docker compose exec -T museum-web node -e "fetch('http://localhost:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" 2>/dev/null; do
              TRIES=$((TRIES + 1))
              if [ "$TRIES" -ge "$MAX_TRIES" ]; then
                echo "Healthcheck failed after ${MAX_TRIES} attempts"
                exit 1
              fi
              echo "  attempt ${TRIES}/${MAX_TRIES}..."
              sleep 3
            done
            echo "museum-web is healthy."

      - name: Smoke test (functional)
        run: |
          set -e
          BASE_URL="${{ secrets.PROD_WEB_BASE_URL }}"
          BASE_URL="${BASE_URL%/}"
          sleep 10

          echo "[smoke] checking landing page SSR..."
          LANDING="$(curl -sfL "${BASE_URL}/")"
          echo "$LANDING" | grep -q '<html lang="' || (echo "FAIL: locale middleware did not set lang attribute" && exit 1)
          echo "$LANDING" | grep -q '<meta name="description"' || (echo "FAIL: meta description missing — SEO broken" && exit 1)

          echo "[smoke] checking sitemap..."
          curl -sfL "${BASE_URL}/sitemap.xml" | grep -q '<urlset' || (echo "FAIL: sitemap.xml unreachable or malformed" && exit 1)

          echo "[smoke] checking _next static assets..."
          ASSET_URL="$(echo "$LANDING" | grep -oE '/_next/static/[^" ]+\.(js|css)' | head -1 || true)"
          if [ -n "$ASSET_URL" ]; then
            curl -sfI "${BASE_URL}${ASSET_URL}" >/dev/null || (echo "FAIL: static asset ${ASSET_URL} unreachable" && exit 1)
          else
            echo "WARN: no /_next/static asset reference found in landing HTML"
          fi

          echo "[smoke] checking /api/health round-trip..."
          HEALTH_HTTP="$(curl -s -o /tmp/health.json -w '%{http_code}' "${BASE_URL}/api/health" || echo 000)"
          if [ "$HEALTH_HTTP" != "200" ]; then
            echo "FAIL: /api/health returned HTTP ${HEALTH_HTTP} (expected 200) — BE/FE integration broken"
            cat /tmp/health.json || true
            exit 1
          fi

          echo "[smoke] all functional checks passed"
