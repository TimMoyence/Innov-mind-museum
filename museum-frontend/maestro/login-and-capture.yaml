appId: com.musaium.mobile

env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}

---
- tapOn:
    point: '50%,37%'
- inputText: ${TEST_EMAIL}

- tapOn:
    point: '50%,42%'
- inputText: ${TEST_PASSWORD}

- hideKeyboard
- tapOn:
    text: '.*Se connecter.*'

- extendedWaitUntil:
    visible: '.*Musaium.*|.*Bonjour.*'
    timeout: 20000

- takeScreenshot: 02_home

- tapOn:
    text: '.*onversation.*'
    optional: true
- extendedWaitUntil:
    visible: '.*onversation.*'
    timeout: 8000

- takeScreenshot: 03_conversations

- tapOn:
    text: '.*ccueil.*|.*ome.*'
    optional: true

- tapOn:
    text: '.*églages.*|.*ettings.*'
    optional: true
- extendedWaitUntil:
    visible: '.*églages.*|.*ettings.*|.*ompte.*|.*rofil.*'
    timeout: 5000

- takeScreenshot: 04_settings
