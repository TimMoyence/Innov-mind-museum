appId: com.musaium.mobile

env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}

---
- launchApp:
    clearState: false

- tapOn:
    text: '.*localhost.*'
    optional: true

- tapOn:
    text: 'Continue'
    optional: true

- tapOn:
    text: '.*ontinue.*|.*ismiss.*|.*lose.*'
    optional: true

- extendedWaitUntil:
    visible: '.*Bon retour.*|.*Se connecter.*|.*Sign in.*'
    timeout: 20000

- takeScreenshot: 01_auth

- tapOn:
    text: '.*E-mail.*'
    index: 0
    optional: true
- tapOn:
    point: '50%,46%'
    optional: true
- inputText: ${TEST_EMAIL}

- tapOn:
    text: '.*Mot de passe.*'
    index: 0
    optional: true
- tapOn:
    point: '50%,52%'
    optional: true
- inputText: ${TEST_PASSWORD}

- hideKeyboard
- tapOn:
    text: '.*Se connecter.*'

- extendedWaitUntil:
    visible: '.*Musaium.*|.*Bonjour.*|.*Hello.*'
    timeout: 20000

- takeScreenshot: 02_home

- tapOn:
    text: '.*onversation.*'
    optional: true

- extendedWaitUntil:
    visible: '.*onversation.*'
    timeout: 8000

- takeScreenshot: 03_conversations

- tapOn:
    text: '.*ccueil.*|.*ome.*'
    optional: true

- tapOn:
    text: '.*églages.*|.*aramètre.*|.*ettings.*'
    optional: true

- extendedWaitUntil:
    visible: '.*églages.*|.*aramètre.*|.*ettings.*|.*ompte.*'
    timeout: 5000

- takeScreenshot: 04_settings
