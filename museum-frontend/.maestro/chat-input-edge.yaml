appId: com.musaium.mobile.preview
---
- runFlow:
    file: helpers/chat-entry.yaml

- tapOn:
    id: 'send-button'
- assertNotVisible:
    id: 'chat-bubble-assistant'
- assertVisible:
    id: 'chat-input'

- tapOn:
    id: 'chat-input'
- inputText: 'qwzx!! 9384 ~~~ zzzplargh ++ %%% kkkrrr'
- hideKeyboard
- tapOn:
    id: 'send-button'
- assertVisible:
    text: '.*zzzplargh.*'
- extendedWaitUntil:
    visible:
      id: 'chat-bubble-assistant'
    timeout: 40000
- assertVisible:
    id: 'chat-bubble-assistant'
