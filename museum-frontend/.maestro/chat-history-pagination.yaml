appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    id: 'analytics-consent-decline'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- tapOn:
    text: '.*(Musées|Museums).*'
- extendedWaitUntil:
    visible:
      id: 'museum-card'
    timeout: 40000
- tapOn:
    id: 'museum-card'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'museum-sheet-start-chat'
    timeout: 40000
- tapOn:
    id: 'museum-sheet-start-chat'
- extendedWaitUntil:
    visible:
      text: 'Accepter tout|Accept all'
    timeout: 20000
- tapOn:
    text: 'Accepter tout|Accept all'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'chat-input'
    timeout: 40000

- tapOn:
    id: 'chat-input'
- inputText: 'Tell me about the Mona Lisa.'
- hideKeyboard
- tapOn:
    id: 'send-button'
- assertVisible: 'Tell me about the Mona Lisa.'
- extendedWaitUntil:
    visible:
      id: 'chat-bubble-assistant'
    timeout: 40000

- tapOn:
    id: 'chat-input'
- inputText: 'Who painted it?'
- hideKeyboard
- tapOn:
    id: 'send-button'
- assertVisible: 'Who painted it?'
- waitForAnimationToEnd:
    timeout: 30000

- tapOn:
    id: 'chat-input'
- inputText: 'In which museum is it kept?'
- hideKeyboard
- tapOn:
    id: 'send-button'
- assertVisible: 'In which museum is it kept?'
- waitForAnimationToEnd:
    timeout: 30000

- scrollUntilVisible:
    element:
      text: 'Tell me about the Mona Lisa.'
    direction: UP
    timeout: 25000
    visibilityPercentage: 40

- tapOn:
    text: 'Fermer la conversation|Close conversation'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: 'Musées à proximité|Nearby museums|Votre compagnon de musée|Your museum companion'
    timeout: 40000
- assertNotVisible:
    id: 'chat-input'
