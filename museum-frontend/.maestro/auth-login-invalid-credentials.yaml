appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- tapOn:
    id: 'email-input'
- inputText: 'maestro-nope-nonexistent@local.dev'

- tapOn:
    id: 'password-input'
- inputText: 'WrongPassword!9999'

- hideKeyboard

- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true

- extendedWaitUntil:
    visible:
      id: 'auth-error-state'
    timeout: 10000

- extendedWaitUntil:
    visible:
      text: '.*(Wrong email or password|Email ou mot de passe incorrect).*'
    timeout: 10000

- assertVisible:
    text: 'Welcome back|Bon retour'
- assertNotVisible:
    text: 'Your museum companion|Votre compagnon de musée'
