appId: com.musaium.mobile.preview
---
- runFlow:
    file: helpers/chat-entry.yaml

- tapOn:
    id: 'chat-input'
- inputText: 'Who painted the Mona Lisa and where is it kept?'
- hideKeyboard
- tapOn:
    id: 'send-button'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'chat-bubble-assistant'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'source-citation-marker'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'source-citation-marker'
    index: 0
- waitForAnimationToEnd

- assertVisible:
    id: 'source-citation-open-url'
- tapOn:
    id: 'source-citation-close'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'source-citation-open-url'
