appId: com.musaium.mobile.preview
---
- runFlow:
    file: helpers/chat-entry.yaml

- tapOn:
    id: 'chat-input'
- inputText: 'I have been thinking a great deal about the development of European painting and I would love a '
- inputText: 'thorough explanation, because I keep getting confused about how the different periods connect to '
- inputText: 'one another. Could you walk me through how the Renaissance emphasis on linear perspective and '
- inputText: 'anatomical precision, as seen in artists like Leonardo da Vinci and Raphael, eventually gave way to '
- inputText: 'the dramatic light and movement of the Baroque period with painters such as Caravaggio and Rubens, '
- inputText: 'and then how that in turn influenced the more restrained Neoclassical style, before the Romantics '
- inputText: 'reacted against all of it with emotion and the sublime, and finally how the Impressionists like '
- inputText: 'Monet and Renoir broke from academic tradition entirely by painting light and fleeting moments '
- inputText: 'outdoors? I am especially curious about which specific technical innovations, materials, and '
- inputText: 'changes in patronage drove each of these transitions, and whether the museums of a city like '
- inputText: 'Bordeaux would typically hold representative works from each of these movements so that a visitor '
- inputText: 'could trace the whole arc in a single afternoon. Please be as detailed as you can about the '
- inputText: 'through-line connecting these eras.'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'send-button'

- assertVisible:
    text: '.*development of European painting.*'

- extendedWaitUntil:
    visible:
      id: 'chat-bubble-assistant'
    timeout: 60000
- assertVisible:
    id: 'chat-bubble-assistant'
