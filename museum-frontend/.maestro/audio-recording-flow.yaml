appId: com.musaium.mobile.preview
---
- runFlow:
    file: helpers/chat-entry.yaml

- tapOn:
    id: 'composer-mic-button'
- waitForAnimationToEnd

- tapOn:
    id: 'voice-disclosure-start'
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: 'Allow|OK|Autoriser'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'composer-mic-button'
- waitForAnimationToEnd

- tapOn:
    id: 'send-button'
- waitForAnimationToEnd:
    timeout: 30000

- extendedWaitUntil:
    visible: "Who painted the Mona Lisa\\??"
    timeout: 60000
- assertVisible:
    id: 'chat-bubble-assistant'
- scrollUntilVisible:
    element:
      text: 'Écouter|Listen'
    direction: DOWN
    timeout: 20000

- tapOn:
    text: 'Fermer la conversation|Close conversation'
    optional: true
- waitForAnimationToEnd
