appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- stopApp
- openLink:
    link: 'musaium:///(stack)/reset-password?token=e2e-reset-token'
- waitForAnimationToEnd:
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: 'reset-password-new'
    timeout: 40000

- tapOn:
    id: 'reset-password-new'
- inputText: 'Mx7$kq2Lp9vRt4Wz'
- hideKeyboard

- tapOn:
    id: 'reset-password-confirm'
- inputText: 'Mx7$kq2Lp9vRt4Wz'
- hideKeyboard

- tapOn:
    id: 'reset-password-submit'
- waitForAnimationToEnd:
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: 'reset-password-success'
    timeout: 40000
    optional: true
- tapOn:
    id: 'reset-password-cta'
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
