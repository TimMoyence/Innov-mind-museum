appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- tapOn:
    id: 'hero-settings-button'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 40000
- openLink:
    link: 'musaium:///(stack)/settings'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 40000

- tapOn:
    text: 'Support'
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: 'Créer un ticket|Create Ticket'
    timeout: 40000

- swipe:
    direction: UP
    duration: 400
- tapOn:
    text: 'Retourner aux paramètres|Return to settings'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 40000
