appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- setLocation:
    latitude: 44.8378
    longitude: -0.5792
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- openLink:
    link: 'musaium:///(stack)/museums-picker'
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'museum-picker-screen'
    timeout: 20000

- tapOn:
    id: 'museum-picker-search'
- inputText: 'Mus'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'museum-picker-row-.*'
    timeout: 20000
- tapOn:
    text: '.*Aquitaine.*'
- tapOn:
    text: '.*Aquitaine.*'
    optional: true
- tapOn:
    text: 'Accepter tout|Accept all'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'chat-input'
    timeout: 30000
- assertVisible:
    id: 'chat-input'
