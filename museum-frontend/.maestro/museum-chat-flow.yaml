appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    id: 'analytics-consent-decline'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- tapOn:
    text: '.*(Musées|Museums).*'
- extendedWaitUntil:
    visible:
      id: 'museum-card'
    timeout: 40000

- tapOn:
    id: 'museum-card'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'museum-sheet-start-chat'
    timeout: 40000

- tapOn:
    id: 'museum-sheet-start-chat'

- extendedWaitUntil:
    visible:
      text: 'Accepter tout|Accept all'
    timeout: 20000
- tapOn:
    text: 'Accepter tout|Accept all'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'chat-input'
    timeout: 40000

- tapOn:
    id: 'chat-input'
- inputText: 'What artworks can I see here?'
- hideKeyboard
- tapOn:
    id: 'send-button'
- assertVisible: 'What artworks can I see here?'

- extendedWaitUntil:
    visible:
      id: 'chat-bubble-assistant'
    timeout: 40000
- assertVisible:
    id: 'chat-bubble-assistant'
