appId: com.musaium.mobile.preview
---
- runFlow:
    file: helpers/chat-entry.yaml

- tapOn:
    id: 'composer-attach-button'
- waitForAnimationToEnd
- tapOn:
    id: 'attachment-picker-compare'
- waitForAnimationToEnd

- tapOn:
    text: 'Allow|Allow Access to All Photos|Autoriser|Tout autoriser'
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: 'test-artwork.jpg'
    optional: true
- tapOn:
    point: '15%,30%'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Similar artworks|Œuvres similaires'
    timeout: 60000
- assertVisible:
    text: 'Similar artworks|Œuvres similaires'

- assertVisible:
    text: 'Similar artwork:.*|Œuvre similaire :.*'
- tapOn:
    text: 'Similar artwork:.*|Œuvre similaire :.*'
- waitForAnimationToEnd
- assertVisible:
    id: 'image-fullscreen-modal-close'
- tapOn:
    id: 'image-fullscreen-modal-close'
- waitForAnimationToEnd
- assertVisible:
    text: 'Similar artwork:.*|Œuvre similaire :.*'
