appId: com.musaium.mobile.preview
---
- runFlow:
    file: open-link.yaml
    env:
      LINK: 'musaium:///(stack)/settings'
- scrollUntilVisible:
    element:
      text: "${MODE}"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "${MODE}"
- runFlow:
    file: back.yaml
- waitForAnimationToEnd
