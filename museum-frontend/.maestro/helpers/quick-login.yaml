appId: com.musaium.mobile.preview
---
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'

- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'

- hideKeyboard

- tapOn:
    id: 'auth-submit'
    optional: true

- waitForAnimationToEnd:
    timeout: 10000

- tapOn:
    text: 'Skip|Passer'
    optional: true
- waitForAnimationToEnd
