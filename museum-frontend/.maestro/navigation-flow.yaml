appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000

- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'

- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    id: 'analytics-consent-decline'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true

- tapOn:
    text: '.*(Tableau de bord|Dashboard).*'
- extendedWaitUntil:
    visible:
      text: 'Tableau de bord|Dashboard'
    timeout: 15000

- tapOn:
    text: '.*(Musées|Museums).*'
- extendedWaitUntil:
    visible:
      text: 'Musées à proximité|Nearby Museums'
    timeout: 15000

- tapOn:
    text: '.*(Accueil|Home).*'
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 15000

- tapOn:
    id: 'hero-settings-button'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 15000

- scrollUntilVisible:
    element:
      text: 'Ouvrir les préférences|Open Preferences'
    direction: DOWN

- tapOn:
    text: 'Ouvrir les préférences|Open Preferences'
- extendedWaitUntil:
    visible:
      text: 'Préférences|Preferences'
    timeout: 15000

- tapOn:
    text: 'Paramètres|Settings'
- extendedWaitUntil:
    visible:
      text: 'Ouvrir les préférences|Open Preferences'
    timeout: 15000

- scrollUntilVisible:
    element:
      text: "Return to home screen|Retourner à l'écran d'accueil"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 1
- tapOn:
    text: "Return to home screen|Retourner à l'écran d'accueil"
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 15000
