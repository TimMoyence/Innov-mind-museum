appId: com.musaium.mobile.preview
---
# screen: MuseumDetailScreen
# Museum Branding (C4) — co-branding happy path over museum-detail.
#
# UFR-021: museum-detail.tsx renders the per-museum branded theme (logo + brand
# primary color on the "Start Chat Here" CTA). This flow reaches the screen via
# the real affordance — Museums tab → museum card → sheet → "View details" — and
# verifies the branded detail rendered, then taps the CTA into a museum-context
# chat. App is FRENCH; selectors use FR|EN alternation.

# ──────────────────────────────────────────────
# Phase 0: Fresh launch + login → home
# ──────────────────────────────────────────────
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Bon retour|Welcome back|Pas de compte|Sign up"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "analytics-consent-banner"
    timeout: 15000
- tapOn:
    id: "analytics-consent-decline"
- tapOn:
    id: "email-input"
- inputText: "e2e-test-login@test.musaium.dev"
- tapOn:
    id: "password-input"
- inputText: "TestPassword123!"
# Dismiss the keyboard with a static-text tap, NOT `hideKeyboard`. On iOS,
# Maestro's hideKeyboard gesture lands on `auth-submit` (it sits directly under
# the password field, exactly where the keyboard was) and fires the login early —
# the submit then races the step, so `hideKeyboard` itself flakes and/or
# `auth-submit` is already unmounted by the next command. The app does NOT submit
# on return (LoginForm.tsx wires `onPress` only, no `onSubmitEditing`): this is a
# Maestro-iOS artefact. Tapping the non-interactive title dismisses the keyboard
# deterministically and leaves the explicit submit below as the real trigger.
- tapOn:
    text: "Welcome back|Bon retour"
- tapOn:
    id: "auth-submit"
- tapOn:
    text: "Plus tard|Not Now"
    optional: true
- tapOn:
    text: "Passer|Skip"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Votre compagnon de musée|Your museum companion"
    timeout: 40000

# ──────────────────────────────────────────────
# Phase 1: Museums tab → first museum card → sheet → "View details"
# ──────────────────────────────────────────────
- tapOn:
    text: ".*(Musées|Museums).*"
- extendedWaitUntil:
    visible:
      id: "museum-card"
    timeout: 40000
- tapOn:
    id: "museum-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "museum-sheet-view-details"
    timeout: 15000
# Let the sheet open-animation settle so the first tap lands on the button.
- waitForAnimationToEnd
- tapOn:
    id: "museum-sheet-view-details"
- waitForAnimationToEnd

# ──────────────────────────────────────────────
# Phase 2: Assert the branded museum-detail screen rendered.
# Unique marker = the "Start Chat Here" CTA (museumDirectory.start_chat), which
# carries the museum's brand primary color (co-branding).
# ──────────────────────────────────────────────
# The start-chat CTA sits BELOW the fold on this screen (hero + details + photo +
# "À propos" render first), so the previous `extendedWaitUntil` could never see it:
# it waited 40s for an element that no amount of waiting would bring on screen —
# only a scroll would. Scroll to its testID (`museum-detail-start-chat`, added to
# app/(stack)/museum-detail.tsx) so the selector is not coupled to the i18n
# catalogue, then assert the branded title too so the string stays covered.
- scrollUntilVisible:
    element:
      id: "museum-detail-start-chat"
    direction: DOWN
    visibilityPercentage: 50
    speed: 25
    waitToSettleTimeoutMs: 800
    timeout: 30000
- assertVisible:
    id: "museum-detail-start-chat"
- assertVisible:
    text: "Démarrer un chat ici|Start Chat Here"
# UFR-021 anchor for app/(stack)/museum-detail.tsx — the Museums tab → card →
# sheet → "View details" tap above opened the /(stack)/museum-detail route (the
# sentinel matches the "/museum-detail" route literal). The branded "Démarrer un
# chat ici|Start Chat Here" CTA above is the runtime proof we reached the branded
# detail; this deep-link re-resolves the same route (the screen renders the
# start-chat CTA regardless of params).
- openLink:
    link: "musaium:///(stack)/museum-detail"
# Same reason as above: scroll to the CTA's testID — it is below the fold and its
# title is not queryable on iOS (accessibilityLabel collapses the subtree).
- scrollUntilVisible:
    element:
      id: "museum-detail-start-chat"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 40000

# ──────────────────────────────────────────────
# Phase 3: Tap "Start Chat Here" → museum-context chat composer.
# (The first-time AI-disclosure consent sheet covers chat-input — accept first.)
# ──────────────────────────────────────────────
- tapOn:
    id: "museum-detail-start-chat"
- tapOn:
    text: "Accepter tout|Accept all"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 40000
- assertVisible:
    id: "chat-input"
