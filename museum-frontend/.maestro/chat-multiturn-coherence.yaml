appId: com.musaium.mobile.preview
---
# Conversation category: MULTI-TURN coherence → 3 real LLM round-trips in one
# session with context-dependent follow-ups.
#
# Turn 1 names a subject (Claude Monet). Turns 2 and 3 use anaphora ("he",
# "his") that only resolve if the session history is threaded into the LLM
# context — i.e. the app maintains a coherent multi-turn conversation. At the UI
# layer we prove each turn is accepted (user echo) and the session keeps
# producing real assistant messages turn after turn (no crash, no stuck pending).
# Deterministic semantic coherence is additionally covered by the backend AI
# matrix; here we exercise the real end-to-end multi-turn loop through the UI.

- runFlow:
    file: helpers/chat-entry.yaml

# ── Turn 1 ──
- tapOn:
    id: "chat-input"
- inputText: "Tell me about the painter Claude Monet."
- hideKeyboard
- tapOn:
    id: "send-button"
- assertVisible: "Tell me about the painter Claude Monet."
- extendedWaitUntil:
    visible:
      id: "chat-bubble-assistant"
    timeout: 40000

# ── Turn 2 (anaphora: "he" → Monet, requires session context) ──
- tapOn:
    id: "chat-input"
- inputText: "Which art movement did he help to found?"
- hideKeyboard
- tapOn:
    id: "send-button"
- assertVisible: "Which art movement did he help to found?"
# Let the second round-trip complete (the assistant bubble from turn 1 persists,
# so we wait on animation/latency rather than re-assert the same id).
- waitForAnimationToEnd:
    timeout: 40000

# THE COHERENCE ASSERTION. This flow is named "multiturn coherence" and, until
# 2026-07-14, it asserted nothing whatsoever about what the assistant SAID — only
# that bubbles appeared. It therefore could not tell a coherent conversation from
# a dead LLM restating each question back at the user, which is precisely what the
# backend was doing (INC-2026-07-14-otel-openai-structured).
#
# "Which art movement did HE help to found?" only has an answer if the model still
# knows that "he" is Claude Monet. Impressionism is that answer — a hard fact, and
# the only word here that is not the model's to choose. If the anaphora is lost, or
# the model is not answering at all, this line goes red.
- extendedWaitUntil:
    visible:
      text: ".*([Ii]mpressionis|[Ii]mpressionnis).*"
    timeout: 40000

# ── Turn 3 (anaphora: "his" → Monet) ──
- tapOn:
    id: "chat-input"
- inputText: "Name one of his most famous paintings."
- hideKeyboard
- tapOn:
    id: "send-button"
- assertVisible: "Name one of his most famous paintings."
- waitForAnimationToEnd:
    timeout: 40000

# After three turns the session is still healthy: a real assistant bubble is on
# screen and the composer is ready for more.
# INC-2026-07-14 — asserting the bubble EXISTS proves NOTHING: the canned fallback
# template the backend serves when the LLM is unreachable IS a valid assistant
# bubble. 17 of the 18 chat flows stayed GREEN for weeks against a 100%-dead LLM
# because of exactly this assertion. The helper asserts the bubble exists AND that
# what it says is not that template. DO NOT revert to a bare assertVisible.
- runFlow:
    file: helpers/assert-llm-answered.yaml
- assertVisible:
    id: "chat-input"
