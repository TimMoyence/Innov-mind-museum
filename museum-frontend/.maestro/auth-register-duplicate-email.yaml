appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- tapOn:
    text: "Passer à l'inscription|Switch to registration"
- waitForAnimationToEnd
- assertVisible:
    text: 'Create your account|Créez votre compte'

- tapOn:
    id: 'firstname-input'
- inputText: 'Maestro'

- tapOn:
    id: 'lastname-input'
- inputText: 'Tester'

- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'

- tapOn:
    id: 'password-input'
- inputText: 'Mx7$kq2Lp9vRt4Wz'

- tapOn:
    id: 'date-of-birth-input'
- inputText: '10/08/1994'

- tapOn:
    text: 'Create your account|Créez votre compte'

- tapOn:
    id: 'gdpr-consent-checkbox'

- extendedWaitUntil:
    visible:
      id: 'auth-submit'
    timeout: 10000
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true

- extendedWaitUntil:
    visible:
      id: 'auth-error-state'
    timeout: 10000

- extendedWaitUntil:
    visible:
      text: '.*(already exists with this email|existe déjà avec cette adresse).*'
    timeout: 10000

- assertVisible:
    text: 'Create your account|Créez votre compte'
- assertNotVisible:
    text: 'Your museum companion|Votre compagnon de musée'
