appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- runFlow:
    file: helpers/register-form.yaml
    env:
      EMAIL: 'e2e-test-login@test.musaium.dev'
      PASSWORD: 'Mx7$kq2Lp9vRt4Wz'
      DOB: '10/08/1994'

- extendedWaitUntil:
    visible:
      id: 'auth-error-state'
    timeout: 10000

- extendedWaitUntil:
    visible:
      text: '.*(already exists with this email|existe déjà avec cette adresse).*'
    timeout: 10000

- assertVisible:
    text: 'Create your account|Créez votre compte'
- assertNotVisible:
    text: 'Your museum companion|Votre compagnon de musée'
