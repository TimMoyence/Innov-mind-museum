appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- setLocation:
    latitude: 44.8378
    longitude: -0.5792
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- tapOn:
    text: '.*(Musées|Museums).*'
- extendedWaitUntil:
    visible:
      id: 'museum-card'
    timeout: 40000

- tapOn:
    text: 'Rechercher des musées...|Search museums...'
- inputText: 'Bordeaux'
- waitForAnimationToEnd
- assertVisible:
    text: 'Musées à proximité|Nearby Museums'

- tapOn:
    text: 'Bordeaux'
- eraseText
- assertNotVisible:
    text: 'Bordeaux'
- extendedWaitUntil:
    visible:
      id: 'museum-card'
    timeout: 40000
