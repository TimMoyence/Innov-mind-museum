appId: com.musaium.mobile.preview
---
- runFlow:
    file: helpers/chat-entry.yaml

- runFlow:
    file: helpers/data-saving-mode.yaml
    env:
      MODE: 'Économie activée|Saving enabled'

- extendedWaitUntil:
    visible:
      id: 'low-data-badge'
    timeout: 15000

- tapOn:
    id: 'chat-input'
- inputText: 'Parle-moi de cette oeuvre.'
- hideKeyboard
- tapOn:
    id: 'send-button'

- setAirplaneMode: enabled
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Vous êtes hors ligne|You're offline"
    timeout: 12000
    optional: true
- assertNotVisible:
    text: 'NETWORK_ERROR|ECONNREFUSED|undefined|null|TypeError'

- setAirplaneMode: disabled
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: 'offline-banner'
    timeout: 20000
    optional: true

- extendedWaitUntil:
    visible:
      id: 'low-data-badge'
    timeout: 15000
- tapOn:
    id: 'low-data-badge'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 40000

- scrollUntilVisible:
    element:
      text: 'Automatique|Automatic'
    direction: DOWN
    timeout: 20000
- tapOn:
    text: 'Automatique|Automatic'
