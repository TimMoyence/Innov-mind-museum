appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: false

- waitForAnimationToEnd

- tapOn:
    id: 'analytics-consent-decline'
    optional: true

- openLink:
    link: 'musaium:///(stack)/confirm-email-change?token=e2e-confirm-token'
- waitForAnimationToEnd:
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: 'confirm-email-change-success'
    timeout: 40000
    optional: true
- tapOn:
    id: 'confirm-email-change-cta'
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
