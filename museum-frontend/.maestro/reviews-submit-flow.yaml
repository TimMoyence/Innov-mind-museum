appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
    optional: true
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    id: 'analytics-consent-decline'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- tapOn:
    id: 'hero-settings-button'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 40000
- scrollUntilVisible:
    element:
      text: 'Ouvrir les avis|Open reviews|Noter Musaium|Rate Musaium'
    direction: DOWN
    visibilityPercentage: 1
    timeout: 20000
- tapOn:
    text: 'Ouvrir les avis|Open reviews|Noter Musaium|Rate Musaium'
- extendedWaitUntil:
    visible:
      text: 'Avis|Reviews'
    timeout: 40000
- openLink:
    link: 'musaium:///(stack)/reviews'
- extendedWaitUntil:
    visible:
      text: 'Avis|Reviews'
    timeout: 40000

- tapOn:
    text: 'Écrire un avis|Write a Review'
- extendedWaitUntil:
    visible:
      id: 'nps-scale'
    timeout: 40000

- tapOn:
    id: 'nps-value-9'
- tapOn:
    id: 'reviews-comment-input'
- waitForAnimationToEnd
- inputText: 'An unforgettable visit to this museum, '
- inputText: 'highly recommend the whole experience.'
- waitForAnimationToEnd
- hideKeyboard
- tapOn:
    text: "Envoyer l'avis|Submit Review"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: '.*(Merci pour votre avis|Thank you for your review|Vous avez déjà soumis un avis|You have already submitted a review).*'
    timeout: 40000
