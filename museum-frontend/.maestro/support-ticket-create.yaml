appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- tapOn:
    id: 'hero-settings-button'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 40000
- tapOn:
    text: 'Support'
    index: 0
- extendedWaitUntil:
    visible:
      text: 'Créer un ticket|Create Ticket'
    timeout: 40000
- openLink:
    link: 'musaium:///(stack)/support'
- extendedWaitUntil:
    visible:
      text: 'Créer un ticket|Create Ticket'
    timeout: 40000

- tapOn:
    text: 'Créer un ticket|Create Ticket'
- extendedWaitUntil:
    visible:
      text: 'Sujet|Subject'
    timeout: 40000

- tapOn:
    id: 'ticket-subject-input'
- inputText: 'Maestro e2e smoke ticket'
- tapOn:
    text: 'Sujet|Subject'

- tapOn:
    id: 'ticket-description-input'
- inputText: 'This ticket was submitted by the automated Maestro e2e flow. Please ignore and close.'
- tapOn:
    text: 'Description'

- tapOn:
    text: 'Soumettre le ticket|Submit Ticket'
- extendedWaitUntil:
    visible:
      text: 'Ticket créé avec succès|Ticket created successfully'
    timeout: 40000
- tapOn:
    text: 'OK'
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Maestro e2e smoke ticket'
    timeout: 40000
- assertVisible:
    text: 'Maestro e2e smoke ticket'
- openLink:
    link: 'musaium:///(stack)/ticket-detail'
- waitForAnimationToEnd

- openLink:
    link: 'musaium:///(stack)/tickets'
- extendedWaitUntil:
    visible:
      text: 'Mes tickets|My Tickets'
    timeout: 40000
- assertVisible:
    text: 'Mes tickets|My Tickets'
