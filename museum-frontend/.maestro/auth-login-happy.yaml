appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- tapOn:
    id: 'email-input'
- inputText: 'apple.test@apple.com'

- tapOn:
    id: 'password-input'
- inputText: 'Apple1234!'

- hideKeyboard

- tapOn:
    id: 'auth-submit'
    optional: true
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true

- waitForAnimationToEnd:
    timeout: 10000

- tapOn:
    text: 'Skip|Passer'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000

- assertNotVisible:
    text: 'Welcome back|Bon retour'
- assertNotVisible:
    id: 'auth-submit'
