appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour|No account|Pas de compte'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- runFlow:
    when:
      visible:
        text: 'Welcome back|Bon retour'
    file: helpers/quick-login.yaml

- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    text: 'Skip|Passer'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000

- stopApp
- waitForAnimationToEnd

- launchApp:
    clearState: false

- waitForAnimationToEnd

- tapOn:
    text: 'Skip|Passer'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000

- assertNotVisible:
    text: 'Welcome back|Bon retour'
