appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- tapOn:
    id: 'email-input'
- inputText: 'e2e-delete@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- waitForAnimationToEnd:
    timeout: 10000

- tapOn:
    text: 'Skip|Passer'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000

- tapOn:
    id: 'hero-settings-button'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: 'Settings|Paramètres'
    timeout: 10000

- scrollUntilVisible:
    element:
      text: 'Zone de danger|Danger Zone'
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 1
    speed: 25
    waitToSettleTimeoutMs: 800
- assertVisible:
    text: 'Zone de danger|Danger Zone'

- tapOn:
    id: 'settings-delete-account'

- extendedWaitUntil:
    visible:
      text: '.*(permanently|définitivement).*'
    timeout: 5000

- tapOn:
    text: '^Delete$|^Supprimer$'

- waitForAnimationToEnd:
    timeout: 10000

- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000

- assertNotVisible:
    text: 'Danger zone|Zone de danger'
- assertNotVisible:
    text: 'Your museum companion|Votre compagnon de musée'
