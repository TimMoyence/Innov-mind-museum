appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
    stopApp: true

- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- assertVisible:
    text: 'Welcome back|Bon retour'

- tapOn:
    text: 'Skip|Passer'
    optional: true
- waitForAnimationToEnd

- assertNotVisible: 'Authentication required'
- assertNotVisible: 'Auth required'
- assertNotVisible: 'Unauthorized'
- assertNotVisible: '401'

- runFlow:
    when:
      visible:
        text: 'Your museum companion|Votre compagnon de musée'
    commands:
      - assertVisible:
          text: 'Your museum companion|Votre compagnon de musée'

- runFlow:
    when:
      visible:
        text: 'Welcome back|Bon retour'
    commands:
      - assertVisible:
          text: 'Welcome back|Bon retour'
      - assertNotVisible: 'Authentication required'
