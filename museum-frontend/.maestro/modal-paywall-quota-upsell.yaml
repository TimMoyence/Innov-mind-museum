appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000

- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- tapOn:
    id: 'email-input'
- inputText: 'e2e-paywall@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'

- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    id: 'analytics-consent-decline'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- scrollUntilVisible:
    element:
      text: 'Commencer une nouvelle conversation|Start a new conversation'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: 'Commencer une nouvelle conversation|Start a new conversation'
- waitForAnimationToEnd:
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: 'quota-upsell-modal'
    timeout: 30000
- assertVisible:
    id: 'quota-upsell-modal'

- tapOn:
    id: 'quota-upsell-email'
- inputText: 'qa+paywall@musaium.test'
- hideKeyboard
- tapOn:
    id: 'quota-upsell-consent'
- tapOn:
    id: 'quota-upsell-submit'
- waitForAnimationToEnd:
    timeout: 15000

- tapOn:
    id: 'quota-upsell-dismiss'
- extendedWaitUntil:
    notVisible:
      id: 'quota-upsell-modal'
    timeout: 15000
- assertNotVisible:
    id: 'quota-upsell-modal'
