appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- runFlow:
    file: helpers/quick-login.yaml

- tapOn:
    text: 'Plus tard|Not Now'
    optional: true

- waitForAnimationToEnd:
    timeout: 10000

- tapOn:
    id: 'biometric-setup-skip'
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: 'Skip|Passer'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000
