appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    id: 'analytics-consent-decline'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000
- scrollUntilVisible:
    element:
      id: 'home-carnet-link'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60

- scrollUntilVisible:
    element:
      text: 'Commencer une nouvelle conversation|Start a new conversation'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: 'Commencer une nouvelle conversation|Start a new conversation'
- waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: 'museum-card'
    commands:
      - tapOn:
          id: 'museum-card'
          index: 0
      - extendedWaitUntil:
          visible:
            id: 'museum-sheet-start-chat'
          timeout: 40000
      - tapOn:
          id: 'museum-sheet-start-chat'

- extendedWaitUntil:
    visible:
      text: 'Accepter tout|Accept all'
    timeout: 20000
- tapOn:
    text: 'Accepter tout|Accept all'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'chat-input'
    timeout: 40000

- tapOn:
    id: 'chat-input'
- inputText: 'Who painted the Mona Lisa?'
- hideKeyboard
- tapOn:
    id: 'send-button'

- assertVisible: 'Who painted the Mona Lisa?'

- extendedWaitUntil:
    visible:
      id: 'chat-bubble-assistant'
    timeout: 40000
- assertVisible:
    id: 'chat-bubble-assistant'

- tapOn:
    id: 'chat-input'
- inputText: 'Tell me about the style of this painting'
- hideKeyboard
- tapOn:
    id: 'send-button'
- assertVisible: 'Tell me about the style of this painting'
- waitForAnimationToEnd:
    timeout: 30000

- tapOn:
    text: 'Fermer la conversation|Close conversation'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'chat-input'
