appId: com.musaium.mobile.preview
---
# screen: AuthScreen
# runtime: NIGHTLY weak-net (device→Toxiproxy, not validated in unit CI)
#
# W3-06 — Auth login + geo resolution under EDGE / low-data (Layer 3 device track).
#
# Proves the cold-start critical path (login → home → reach a museum context that
# resolves coarse location) survives a shaped (EDGE) link: the login round-trip
# and the geo/museum lookup complete within bounded waits instead of hanging, and
# any transient failure surfaces an i18n string — never a raw token (no
# "NETWORK_ERROR" / "ECONNREFUSED" leaking to the user). An offline blip on the
# auth screen shows the i18n offline banner and recovers on reconnect.
#
# DEVICE→PROXY (runtime-deferred): Android nightly only; API base → Toxiproxy
# shaped listener (10.0.2.2:3100) seeded from
# `node scripts/net-shaping/profile-to-toxics.mjs edge`. iOS sim cannot be forced
# offline (best-effort) → offline assertions are optional.
#
# Prereqs: seeded account e2e-test-login@test.musaium.dev / TestPassword123!;
# backend reachable through the shaped proxy.

# ── Launch fresh → land on the auth screen ──
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Bon retour|Welcome back|Pas de compte|Sign up"
    timeout: 45000

# ── Force low-data mode (shaped/compression path) ──
# ORDER IS LOAD-BEARING, and `persist=1` is not optional here.
#
# This used to run BEFORE `launchApp: clearState: true`, and without `persist`.
# Both halves cancelled it: the dev route resets the preference to 'auto' on
# unmount unless `persist=1` (it redirects immediately, so it unmounts at once),
# and `clearState` then wipes AsyncStorage — where the preference lives — anyway.
# The flow forced nothing, and since it never asserts `low-data-badge` (the badge
# is chat-scoped and this flow never enters chat) nothing noticed. The shaping
# itself still came from Toxiproxy, so the flow "passed" while the low-data app
# path it claims to exercise was never switched on.
#
# Forcing AFTER the launch, from the auth screen: the dev route persists the
# preference and `<Redirect href="/">`s, the auth guard bounces an unauthenticated
# user straight back to /auth — so we resume exactly where we were, with low-data
# now genuinely active FOR THE LOGIN, which is the point of this flow.
- openLink: "musaium:///(dev)/force-data-mode?value=low&persist=1"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Bon retour|Welcome back|Pas de compte|Sign up"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "analytics-consent-banner"
    timeout: 15000
- tapOn:
    id: "analytics-consent-decline"

# ── Offline blip on auth → i18n offline banner, NOT a raw token ──
- setAirplaneMode: enabled
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Vous êtes hors ligne|You're offline"
    timeout: 12000
    optional: true
- assertNotVisible:
    text: "NETWORK_ERROR|ECONNREFUSED|undefined|null|TypeError"
- setAirplaneMode: disabled
- waitForAnimationToEnd

# ── Log in over the shaped (EDGE) link — bounded, must not hang ──
- tapOn:
    id: "email-input"
- inputText: "e2e-test-login@test.musaium.dev"
- tapOn:
    id: "password-input"
- inputText: "TestPassword123!"
# Dismiss the keyboard with a static-text tap, NOT `hideKeyboard`. On iOS,
# Maestro's hideKeyboard gesture lands on `auth-submit` (it sits directly under
# the password field, exactly where the keyboard was) and fires the login early —
# the submit then races the step, so `hideKeyboard` itself flakes and/or
# `auth-submit` is already unmounted by the next command. The app does NOT submit
# on return (LoginForm.tsx wires `onPress` only, no `onSubmitEditing`): this is a
# Maestro-iOS artefact. Tapping the non-interactive title dismisses the keyboard
# deterministically and leaves the explicit submit below as the real trigger.
- tapOn:
    text: "Welcome back|Bon retour"
- tapOn:
    id: "auth-submit"
- tapOn:
    text: "Plus tard|Not Now"
    optional: true
- tapOn:
    id: "analytics-consent-decline"
    optional: true
- tapOn:
    text: "Passer|Skip"
    optional: true

# ── Reach home under the shaped link (login round-trip completed) ──
# Widened to 75s: post-login bootstrap under the EDGE profile can stack several
# sequential API round-trips + 1% loss retransmits before home renders.
- extendedWaitUntil:
    visible:
      text: "Votre compagnon de musée|Your museum companion"
    timeout: 75000

# ── Geo path: open the Museums directory → a nearby museum resolves under EDGE ──
- tapOn:
    text: ".*(Musées|Museums).*"
- extendedWaitUntil:
    visible:
      id: "museum-card"
    timeout: 45000
    optional: true

# No raw token leaked anywhere on the geo/museum surface under the shaped link.
- assertNotVisible:
    text: "NETWORK_ERROR|ECONNREFUSED|undefined|null|TypeError"
