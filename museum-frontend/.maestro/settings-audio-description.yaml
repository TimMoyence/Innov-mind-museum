appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- tapOn:
    id: 'hero-settings-button'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 40000

- scrollUntilVisible:
    element:
      text: 'Audiodescription|Audio Description'
    direction: DOWN
    visibilityPercentage: 50
- assertVisible:
    text: 'Accessibilité|Accessibility'
- assertVisible:
    text: 'Audiodescription|Audio Description'

- tapOn:
    text: 'Audiodescription|Audio Description'
- waitForAnimationToEnd

- assertVisible:
    text: 'Audiodescription|Audio Description'

- scrollUntilVisible:
    element:
      text: "Retourner à l'écran d'accueil|Return to home screen"
    direction: DOWN
    visibilityPercentage: 40
- tapOn:
    text: "Retourner à l'écran d'accueil|Return to home screen"
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000
