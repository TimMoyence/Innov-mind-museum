appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour|No account|Pas de compte'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- tapOn:
    text: "Passer à l'inscription|Switch to registration"
- waitForAnimationToEnd
- assertVisible:
    text: 'Create your account|Créez votre compte'

- evalScript: ${ output.timestamp = Date.now().toString(); }

- tapOn:
    id: 'firstname-input'
- inputText: 'Maestro'

- tapOn:
    id: 'lastname-input'
- inputText: 'Tester'

- tapOn:
    id: 'email-input'
- inputText: 'maestro-authflow-${output.timestamp}@local.dev'

- tapOn:
    id: 'password-input'
- inputText: 'Mx7$kq2Lp9vRt4Wz'

- tapOn:
    id: 'date-of-birth-input'
- inputText: '10/08/1994'

- tapOn:
    text: 'Create your account|Créez votre compte'

- tapOn:
    id: 'gdpr-consent-checkbox'

- extendedWaitUntil:
    visible:
      id: 'auth-submit'
    timeout: 10000
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true

- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: '.*(Registration complete|Inscription terminée).*'
    timeout: 40000

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- tapOn:
    id: 'analytics-consent-decline'
    optional: true
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    text: 'Skip|Passer'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000

- tapOn:
    id: 'hero-settings-button'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: 'Settings|Paramètres'
    timeout: 10000

- scrollUntilVisible:
    element:
      text: 'Sign out|Se déconnecter'
    direction: DOWN
- tapOn:
    text: 'Sign out|Se déconnecter'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 15000

- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true

- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: 'Skip|Passer'
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000
- scrollUntilVisible:
    element:
      text: 'Commencer une nouvelle conversation|Start a new conversation'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
