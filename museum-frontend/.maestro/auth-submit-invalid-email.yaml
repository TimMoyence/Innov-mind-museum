appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- tapOn:
    id: 'email-input'
- inputText: 'not-an-email'

- tapOn:
    id: 'password-input'
- inputText: 'AnyValidPwd123'

- tapOn:
    text: 'Welcome back|Bon retour'

- tapOn:
    id: 'auth-submit'

- extendedWaitUntil:
    visible:
      id: 'auth-email-error'
    timeout: 5000

- assertNotVisible:
    id: 'auth-error-state'
- assertVisible:
    text: 'Welcome back|Bon retour'
