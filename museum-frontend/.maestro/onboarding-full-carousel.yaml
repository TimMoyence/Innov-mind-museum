appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
    stopApp: true

- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- runFlow:
    when:
      visible:
        text: 'Welcome back|Bon retour'
    file: helpers/quick-login.yaml

- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    text: "Skip onboarding|Passer l'introduction"
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000

- tapOn:
    id: 'hero-settings-button'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Settings|Paramètres'
    timeout: 10000

- scrollUntilVisible:
    element:
      text: 'Replay onboarding guide|Revoir le guide de démarrage'
    direction: DOWN
    visibilityPercentage: 40

- tapOn:
    text: 'Replay onboarding guide|Revoir le guide de démarrage'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Welcome to Musaium|Bienvenue sur Musaium'
    timeout: 10000

- assertVisible:
    text: "Skip onboarding|Passer l'introduction"
- assertVisible:
    text: 'Next slide|Diapositive suivante'

- tapOn:
    text: 'Next slide|Diapositive suivante'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Museum mode|Mode musée'
    timeout: 5000

- assertVisible:
    text: 'Next slide|Diapositive suivante'
- tapOn:
    text: 'Next slide|Diapositive suivante'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Photograph artworks|Photographier des œuvres'
    timeout: 5000

- assertVisible:
    text: 'Next slide|Diapositive suivante'
- tapOn:
    text: 'Next slide|Diapositive suivante'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Guided walks|Visites guidées'
    timeout: 5000

- assertVisible:
    text: 'Get started|Commencer'

- tapOn:
    text: 'Get started|Commencer'
- waitForAnimationToEnd:
    timeout: 8000

- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000

- assertNotVisible:
    text: 'Welcome to Musaium|Bienvenue sur Musaium'
