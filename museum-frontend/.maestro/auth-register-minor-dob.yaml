appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- runFlow:
    file: helpers/register-form.yaml
    env:
      EMAIL: 'maestro-minor-test@local.dev'
      PASSWORD: 'Mx7$kq2Lp9vRt4Wz'
      DOB: '01/01/2015'

- extendedWaitUntil:
    visible:
      id: 'auth-error-state'
    timeout: 10000

- extendedWaitUntil:
    visible:
      text: '.*(aged 15 and over|15 ans et plus).*'
    timeout: 10000

- assertVisible:
    text: 'Create your account|Créez votre compte'
- assertNotVisible:
    text: 'Your museum companion|Votre compagnon de musée'
