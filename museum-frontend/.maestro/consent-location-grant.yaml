appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    id: 'analytics-consent-decline'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- tapOn:
    text: '.*(Musées|Museums).*'
- extendedWaitUntil:
    visible:
      id: 'museum-card'
    timeout: 40000
- tapOn:
    id: 'museum-card'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'museum-sheet-start-chat'
    timeout: 40000
- tapOn:
    id: 'museum-sheet-start-chat'
- extendedWaitUntil:
    visible:
      text: 'Gérer mes choix|Manage my choices'
    timeout: 40000

- tapOn:
    text: 'Gérer mes choix|Manage my choices'
- waitForAnimationToEnd

- tapOn:
    id: 'consent-switch-third_party_ai_text_openai'
    optional: true

- scrollUntilVisible:
    element:
      id: 'consent-switch-location_to_llm'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
- tapOn:
    id: 'consent-switch-location_to_llm'

- tapOn:
    text: 'Enregistrer et continuer|Save and continue'
- waitForAnimationToEnd:
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: 'chat-input'
    timeout: 40000
