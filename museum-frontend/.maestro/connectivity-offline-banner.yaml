appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    id: 'analytics-consent-decline'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- assertNotVisible:
    id: 'offline-banner'

- setAirplaneMode: enabled
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'offline-banner'
    timeout: 10000
    optional: true

- tapOn:
    id: 'hero-settings-button'
    optional: true
- waitForAnimationToEnd

- assertVisible:
    id: 'offline-banner'
    optional: true

- back
- waitForAnimationToEnd

- assertVisible:
    id: 'offline-banner'
    optional: true

- setAirplaneMode: disabled
- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible:
      id: 'offline-banner'
    timeout: 15000
