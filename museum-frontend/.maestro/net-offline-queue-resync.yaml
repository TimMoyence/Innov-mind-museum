appId: com.musaium.mobile.preview
---
# screen: ChatScreen
# runtime: NIGHTLY weak-net (device→Toxiproxy, not validated in unit CI)
#
# W3-06 — Offline message queue + reconnect resync (Layer 3 device track).
#
# Proves the offline-first queue: while airplane mode is ON the user can still
# type+send a chat message — it is queued locally (the offline banner shows a
# "N en attente / N pending" count, NOT a raw error token). On reconnect the
# queue drains (resync): the banner clears and a real assistant reply lands.
#
# DEVICE→PROXY (runtime-deferred): Android nightly only; on reconnect the API
# base talks to the Toxiproxy shaped listener (10.0.2.2:3100) so the resync is
# exercised under a 3g-lossy condition seeded from
# `node scripts/net-shaping/profile-to-toxics.mjs 3g-lossy`. iOS sim cannot be
# forced offline (best-effort) → offline assertions are optional.
#
# Prereqs: seeded account; backend reachable through the shaped proxy with a
# working LLM provider.

# ── Reach the chat composer, THEN force low-data ──
# ORDER IS LOAD-BEARING, and `persist=1` is not optional. Forcing BEFORE the helper
# cancelled itself twice: the dev route resets the preference to 'auto' on unmount
# unless `persist=1` (it redirects immediately, so it unmounts at once), and
# `chat-entry` opens with `launchApp: clearState: true`, which wipes the
# AsyncStorage the preference lives in. The low-data path this flow claims to
# exercise was never switched on.
- runFlow:
    file: helpers/chat-entry.yaml
- openLink: "musaium:///(dev)/force-data-mode?value=low&persist=1"
- waitForAnimationToEnd
- runFlow:
    file: helpers/chat-reentry.yaml

# ── Go offline BEFORE sending → message must queue, not error ──
- setAirplaneMode: enabled
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Vous êtes hors ligne|You're offline"
    timeout: 12000
    optional: true

- tapOn:
    id: "chat-input"
- inputText: "Quelle est l'histoire de ce lieu ?"
- hideKeyboard
- tapOn:
    id: "send-button"

# ── THE FIRST HALF OF WHAT THIS FLOW CLAIMS: the message QUEUES while offline ──
# This used to be `optional: true`. With every positive step optional, the flow's
# ONLY hard assertion was the `assertNotVisible` below — and a negative assertion
# passes on a blank screen, on the wrong screen, and on an app that crashed back to
# Home. The flow could not fail, so it proved nothing.
#
# If the message does not visibly queue while offline, the offline queue is broken.
# That is a REAL PRODUCT BUG — fix the queue, do not restore `optional`.
- extendedWaitUntil:
    visible:
      text: ".*(en attente|pending).*"
    timeout: 12000
- assertNotVisible:
    text: "NETWORK_ERROR|ECONNREFUSED|undefined|null|TypeError"

# ── Reconnect → queue drains (resync) over the shaped 3g-lossy link ──
- setAirplaneMode: disabled
- waitForAnimationToEnd

# Offline banner clears once connectivity is back.
- extendedWaitUntil:
    notVisible:
      id: "offline-banner"
    timeout: 25000

# ── THE SECOND HALF: the queued message actually FLUSHES and gets answered ──
# This is the whole point of the word "resync" in the filename. It was optional.
- extendedWaitUntil:
    visible:
      id: "chat-bubble-assistant"
    timeout: 90000
# …and the answer must be a real one, not the "model unreachable" template — a
# resync that delivers an empty fallback has resynced nothing worth having.
- runFlow:
    file: helpers/assert-llm-answered.yaml
