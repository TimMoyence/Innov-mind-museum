appId: com.musaium.mobile.preview
---
- runFlow:
    file: helpers/chat-entry.yaml
- runFlow:
    file: helpers/data-saving-mode.yaml
    env:
      MODE: 'Économie activée|Saving enabled'
- extendedWaitUntil:
    visible:
      id: 'low-data-badge'
    timeout: 15000

- setAirplaneMode: enabled
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Vous êtes hors ligne|You're offline"
    timeout: 12000
    optional: true

- tapOn:
    id: 'chat-input'
- inputText: "Quelle est l'histoire de ce lieu ?"
- hideKeyboard
- tapOn:
    id: 'send-button'

- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: '.*(en attente|pending).*'
          timeout: 12000
- assertNotVisible:
    text: 'NETWORK_ERROR|ECONNREFUSED|undefined|null|TypeError'

- setAirplaneMode: disabled
- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible:
      id: 'offline-banner'
    timeout: 25000
    optional: true

- extendedWaitUntil:
    visible:
      id: 'chat-bubble-assistant'
    timeout: 90000
    optional: true

- runFlow:
    file: helpers/data-saving-mode.yaml
    env:
      MODE: 'Automatique|Automatic'
