appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: 'Bon retour|Welcome back|Pas de compte|Sign up'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'
- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'
- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'
- hideKeyboard
- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true
- tapOn:
    text: 'Passer|Skip'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 40000

- tapOn:
    text: '.*(Musées|Museums).*'
- extendedWaitUntil:
    visible:
      id: 'museum-card'
    timeout: 40000
- tapOn:
    id: 'museum-card'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'museum-sheet-view-details'
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: 'museum-sheet-view-details'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: 'Démarrer un chat ici|Start Chat Here'
    timeout: 40000
- tapOn:
    text: 'Retour|Back'
- extendedWaitUntil:
    visible:
      id: 'museum-card'
    timeout: 15000
- tapOn:
    text: '.*(Accueil|Home).*'
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 15000

- tapOn:
    text: '.*(Tableau de bord|Dashboard).*'
- extendedWaitUntil:
    visible:
      text: 'Tableau de bord|Dashboard'
    timeout: 15000
- tapOn:
    text: 'Commencer une nouvelle conversation|Start a new conversation'
- tapOn:
    text: 'Accepter tout|Accept all'
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'send-button'
    timeout: 40000
- tapOn:
    text: 'Fermer la conversation|Close conversation'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: '.*(Accueil|Home).*'
- extendedWaitUntil:
    visible:
      text: 'Votre compagnon de musée|Your museum companion'
    timeout: 15000

- tapOn:
    id: 'hero-settings-button'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 15000

- scrollUntilVisible:
    element:
      text: 'Changer le mot de passe du compte|Change your account password'
    direction: DOWN
    visibilityPercentage: 1
- tapOn:
    text: 'Changer le mot de passe du compte|Change your account password'
- extendedWaitUntil:
    visible:
      text: 'Changer le mot de passe|Change Password'
    timeout: 15000
- openLink:
    link: 'musaium:///(stack)/change-password'
- extendedWaitUntil:
    visible:
      text: 'Changer le mot de passe|Change Password'
    timeout: 15000
- tapOn:
    text: 'Retour|Back'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 15000

- scrollUntilVisible:
    element:
      text: "Changer l'adresse email du compte|Change your account email"
    direction: DOWN
    visibilityPercentage: 1
- tapOn:
    text: "Changer l'adresse email du compte|Change your account email"
- extendedWaitUntil:
    visible:
      text: "Changer d'email|Change Email"
    timeout: 15000
- openLink:
    link: 'musaium:///(stack)/change-email'
- extendedWaitUntil:
    visible:
      text: "Changer d'email|Change Email"
    timeout: 15000
- tapOn:
    text: 'Retour|Back'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 15000

- scrollUntilVisible:
    element:
      text: 'Paramètres|Settings'
    direction: UP
    speed: 80
- waitForAnimationToEnd
- tapOn:
    text: 'RGPD|Privacy'
    index: 0
- extendedWaitUntil:
    visible:
      text: 'Faits essentiels|Quick Facts'
    timeout: 15000
- openLink:
    link: 'musaium:///(stack)/privacy'
- extendedWaitUntil:
    visible:
      text: 'Faits essentiels|Quick Facts'
    timeout: 15000
- tapOn:
    text: 'Paramètres|Settings'
    index: 0
- extendedWaitUntil:
    visible:
      text: 'Ouvrir les préférences|Open Preferences'
    timeout: 15000

- scrollUntilVisible:
    element:
      text: "Ouvrir les conditions d'utilisation|Open Terms of Service"
    direction: DOWN
    visibilityPercentage: 1
- tapOn:
    text: "Ouvrir les conditions d'utilisation|Open Terms of Service"
- extendedWaitUntil:
    visible:
      text: '.*(Version .* Dernière mise à jour|Version .* Last updated).*'
    timeout: 15000
- openLink:
    link: 'musaium:///(stack)/terms'
- extendedWaitUntil:
    visible:
      text: '.*(Version .* Dernière mise à jour|Version .* Last updated).*'
    timeout: 15000
- tapOn:
    text: 'Paramètres|Settings'
    index: 0
- extendedWaitUntil:
    visible:
      text: 'Ouvrir les préférences|Open Preferences'
    timeout: 15000

- scrollUntilVisible:
    element:
      text: 'Paramètres|Settings'
    direction: UP
    speed: 80
- waitForAnimationToEnd
- tapOn:
    text: 'Support'
    index: 0
- extendedWaitUntil:
    visible:
      text: 'Créer un ticket|Create Ticket'
    timeout: 15000
- swipe:
    direction: UP
    duration: 400
- tapOn:
    text: 'Retourner aux paramètres|Return to settings'
- extendedWaitUntil:
    visible:
      text: 'Paramètres|Settings'
    timeout: 15000
