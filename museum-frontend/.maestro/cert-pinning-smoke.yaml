appId: com.musaium.mobile.preview
---
- launchApp:
    clearState: true
    stopApp: true

- extendedWaitUntil:
    visible:
      text: 'Welcome back|Bon retour'
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-banner'
    timeout: 15000
- tapOn:
    id: 'analytics-consent-decline'

- tapOn:
    id: 'email-input'
- inputText: 'e2e-test-login@test.musaium.dev'

- tapOn:
    id: 'password-input'
- inputText: 'TestPassword123!'

- hideKeyboard

- tapOn:
    id: 'auth-submit'
- tapOn:
    text: 'Plus tard|Not Now'
    optional: true

- waitForAnimationToEnd:
    timeout: 10000

- tapOn:
    text: 'Skip|Passer'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: 'Your museum companion|Votre compagnon de musée'
    timeout: 40000

- assertNotVisible:
    text: 'Welcome back|Bon retour'
