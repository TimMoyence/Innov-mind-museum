appId: com.musaium.mobile.preview
---
- runFlow:
    file: helpers/chat-entry.yaml
- runFlow:
    file: helpers/data-saving-mode.yaml
    env:
      MODE: 'Économie activée|Saving enabled'

- extendedWaitUntil:
    visible:
      id: 'low-data-badge'
    timeout: 15000

- tapOn:
    id: 'composer-attach-button'
- waitForAnimationToEnd
- tapOn:
    id: 'attachment-picker-gallery'
- waitForAnimationToEnd
- tapOn:
    text: 'Allow|Allow Access to All Photos|Autoriser|Tout autoriser|Select Photos|Sélectionner des photos'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: 'test-artwork.jpg'
    optional: true
- tapOn:
    point: '15%,30%'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: 'Add|Choose|Ajouter|Choisir|Done|OK'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'chat-input'
- inputText: 'Que peux-tu me dire sur cette oeuvre ?'
- hideKeyboard
- tapOn:
    id: 'send-button'

- extendedWaitUntil:
    visible:
      id: 'chat-bubble-assistant'
    timeout: 90000
    optional: true

- assertNotVisible:
    text: 'NETWORK_ERROR|ECONNREFUSED|undefined|null|TypeError'

- setAirplaneMode: enabled
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Vous êtes hors ligne|You're offline"
    timeout: 12000
    optional: true
- setAirplaneMode: disabled
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: 'offline-banner'
    timeout: 20000
    optional: true

- runFlow:
    file: helpers/data-saving-mode.yaml
    env:
      MODE: 'Automatique|Automatic'
